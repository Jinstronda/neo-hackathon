name: retest-gate

# The merge gate for a fix PR. We rebuild a fresh twin from the patched
# demo-target, replay every exploit against it, and fail unless every objective
# now fails, decided server-side from the twin's event log, never an agent's
# report. demo-target/ is vulnerable on purpose on master, so the replay only
# means something on a PR that changes it; every other PR is covered by ci.yml.

on:
  pull_request:
    branches: [main, master, joao]
    paths: ["demo-target/**"]

concurrency:
  group: retest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retest:
    # the exploit must now fail on the patched twin, decided server-side
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replay exploits on the patched twin (every objective must fail)
        run: |
          set -o pipefail
          python -m infra.replay --phase post-patch | tee retest-events.jsonl

      - name: Upload retest events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retest-events
          path: retest-events.jsonl
          if-no-files-found: ignore
